# M2 训练配置
model:
  vocab_size: 388          # 与 data/tokenized/tokenizer.json 一致（含 PAD/BOS/EOS）
  d_model: 512
  n_layers: 8
  n_heads: 8
  ff_mult: 4               # FFN 隐藏层 = d_model * ff_mult
  dropout: 0.1
  max_seq_len: 2048        # 约 16-32 小节
  rope: true               # 相对位置编码（Music Transformer 证据支持）

train:
  batch_size: 16
  grad_accum: 1
  lr: 3.0e-4
  min_lr: 3.0e-5
  warmup_steps: 500
  weight_decay: 0.01
  betas: [0.9, 0.95]
  grad_clip: 1.0
  epochs: 12
  amp_dtype: bfloat16      # 4090 原生支持
  compile: false           # Windows 上 torch.compile 支持有限，保守关闭
  log_every: 50
  eval_every: 500
  save_every: 1000
  seed: 42
  # 来源采样权重（与 data.yaml 的 sample_weight 对应）
  source_weights:
    animal_crossing: 4.0
    pop909: 1.0
    lakh: 0.5

finetune:                  # 第二阶段：风格收敛（RWTH 证据：预训练->微调更优）
  enabled: true
  sources: [animal_crossing, pop909]
  epochs: 4
  lr: 6.0e-5
  min_lr: 6.0e-6
  warmup_steps: 100

paths:
  tokenized: data/tokenized
  checkpoints: checkpoints
  logs: logs